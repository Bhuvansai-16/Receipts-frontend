name: tests
on: [push, pull_request]
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # npm 11 wrote package-lock.json; npm 10 can't install it
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
